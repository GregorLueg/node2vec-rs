name: Test the package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: GregorLueg/personal-actions/.github/workflows/rust-test.yml@v1
    with:
      cpu-args: '--features tch-cpu'
      # No GPU lane here. An empty gpu-args skips the job entirely.
      gpu-args: ''
    secrets: inherit

  # Mirrors the docs.rs feature set; broken intra-doc links fail the build.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --lib --features cpu,burn
        env:
          RUSTDOCFLAGS: -D warnings
