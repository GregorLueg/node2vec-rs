[package]
name = "node2vec-rs"
version = "0.2.0"
edition = "2021"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
repository = "https://github.com/GregorLueg/node2vec-rs"
description = "A node2vec implementation in Rust via the Burn tensor framework."

[dependencies]
burn = { version = "0.21.0", features = ["dataset", "train"], optional = true }
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
document-features = "0.2.12"
faer = "0.23.2"
indicatif = "0.18.3"
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
rustc-hash = "2.1.1"
tempfile = "3.23.0"
thousands = "0.2.0"
wide = "1.1.1"

[features]
## Default feature is the CPU version
default = ["cpu"]
cpu = []
burn = ["dep:burn"]
tch-cpu = ["burn", "burn/tch"]
tch-mps = ["burn", "burn/tch"]
flex = ["burn", "burn/flex"]
wgpu = ["burn", "burn/wgpu"]
metal = ["burn", "burn/wgpu"]
vulkan = ["burn", "burn/wgpu"]

[[bin]]
name = "node2vec"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
