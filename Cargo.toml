[package]
name = "node2vec-rs"
version = "0.4.0"
edition = "2021"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
repository = "https://github.com/GregorLueg/node2vec-rs"
description = "A node2vec implementation in Rust via the Burn tensor framework."

[dependencies]
burn = { version = "0.22.0", default-features = false, features = [
    "std",
    "dataset",
    "optim",
], optional = true }
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
document-features = "0.2.12"
faer = "0.24.4"
indicatif = "0.18.3"
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
rustc-hash = "2.1.1"
thiserror = "2.0.17"
thousands = "0.2.0"
wide = "1.1.1"

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.23.0"

[features]
## Default feature is the CPU version
default = ["cpu"]
cpu = []
burn = ["dep:burn"]
flex = ["burn", "burn/flex", "burn/simd", "burn/rayon"]
wgpu = ["burn", "burn/wgpu", "burn/fusion", "burn/autotune"]
metal = ["burn", "burn/metal", "burn/fusion", "burn/autotune"]
vulkan = ["burn", "burn/vulkan", "burn/fusion", "burn/autotune"]

[package.metadata.docs.rs]
features = ["cpu", "burn"]

[[bin]]
name = "node2vec"
path = "src/main.rs"

[[bench]]
name = "simd"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
