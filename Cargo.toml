[package]
name = "node2vec-rs"
version = "0.1.3"
edition = "2021"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
repository = "https://github.com/GregorLueg/node2vec-rs"
description = "A node2vec implementation in Rust via the Burn tensor framework."

[dependencies]
burn = { version = "0.20.1", features = ["dataset", "train"] }
clap = { version = "4.5.53", features = ["derive"] }
csv = "1.4.0"
faer = "0.24.0"
indicatif = "0.18.3"
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
rustc-hash = "2.1.1"
tempfile = "3.23.0"
wide = "1.1.1"

[features]
# default = ["tch-cpu"]
# tch-cpu = ["burn/tch"]
# tch-mps = ["burn/tch"]
# ndarray = ["burn/ndarray"]
# ndarray-blas-openblas = ["burn/ndarray", "burn/openblas"]
# ndarray-blas-accelerate = ["burn/ndarray", "burn/accelerate"]
# wgpu = ["burn/wgpu"]
# metal = ["burn/metal"]
# vulkan = ["burn/vulkan"]

[[bin]]
name = "node2vec"
path = "src/main.rs"
